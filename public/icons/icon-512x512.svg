<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="doorGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad512" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />

  <!-- Refrigerator Body -->
  <g transform="translate(126, 70)">
    <!-- Main Outer Fridge Shell -->
    <rect x="0" y="0" width="260" height="370" rx="40" fill="#0f172a" stroke="url(#accentGrad512)" stroke-width="8" filter="url(#glow512)" />
    
    <!-- Top Door (Freezer) -->
    <rect x="16" y="16" width="228" height="120" rx="24" fill="url(#doorGrad512)" />
    <rect x="36" y="60" width="14" height="40" rx="7" fill="#ffffff" fill-opacity="0.9" />

    <!-- Divider -->
    <line x1="16" y1="148" x2="244" y2="148" stroke="#047857" stroke-width="5" />

    <!-- Bottom Door (Fridge) -->
    <rect x="16" y="160" width="228" height="194" rx="24" fill="url(#doorGrad512)" fill-opacity="0.9" />
    <rect x="36" y="200" width="14" height="64" rx="7" fill="#ffffff" fill-opacity="0.9" />

    <!-- Sparkle / Fresh Symbol -->
    <path d="M 180 50 Q 190 65 205 70 Q 190 75 180 90 Q 170 75 155 70 Q 170 65 180 50 Z" fill="#fef08a" />
    <path d="M 210 30 Q 215 38 223 40 Q 215 42 210 50 Q 205 42 197 40 Q 205 38 210 30 Z" fill="#fef08a" />
    
    <!-- Expiry Alert Badge (Clock/Bell) -->
    <circle cx="200" cy="295" r="42" fill="#f43f5e" stroke="#ffffff" stroke-width="6" />
    <circle cx="200" cy="295" r="4" fill="#ffffff" />
    <path d="M 200 270 L 200 295 L 216 295" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>
</svg>
